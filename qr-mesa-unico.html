<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moldura QR Code | Cartão Único | Casa Primavera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --color-primary: #a8241c;
        --color-primary-dark: #7d1a14;
        --color-accent: #c98f2b;
        --color-dark: #241a14;
        --color-muted: #6b5f54;
        --font-heading: 'Playfair Display', Georgia, serif;
        --font-body: 'Nunito Sans', Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #ddd;
        font-family: var(--font-body);
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }
    .print-note {
        text-align: center;
        color: #444;
        margin: 0 0 20px;
    }
    .single-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .tag {
        width: 80mm;
        height: 95mm;
        min-width: 80mm;
        min-height: 95mm;
        flex-shrink: 0;
        background: #fdfaf5;
        border: 5.9mm solid var(--color-accent);
        border-radius: 9mm;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 8px 24px rgba(36, 26, 20, .2);
    }
    .tag-header {
        width: 100%;
        background: var(--color-primary-dark);
        background-image: radial-gradient(circle at 50% -20%, rgba(201, 143, 43, .3), transparent 60%);
        padding: 4.5mm 3mm 3.5mm;
        text-align: center;
    }
    .tag-name {
        font-family: var(--font-heading);
        font-weight: 700;
        color: #fff;
        font-size: 1.25rem;
        line-height: 1.1;
        margin: 0;
    }
    .tag-name small {
        display: block;
        font-family: var(--font-body);
        font-weight: 700;
        font-size: .6rem;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: var(--color-accent);
        margin-top: 3px;
    }
    .tag-body {
        flex: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2mm;
        padding: 2.5mm 3mm 3mm;
    }
    .qr-placeholder {
        width: 51mm;
        height: 51mm;
        background: #fff;
        border: 1.8px solid var(--color-primary);
        border-radius: 5mm;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
        box-shadow: 0 2px 6px rgba(36, 26, 20, .06);
    }
    .qr-code-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    .tag-caption {
        margin: 0;
        color: var(--color-muted);
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .03em;
    }
    @media print {
        body { background: #fff; padding: 0; min-height: auto; }
        .print-note { display: none; }
        .tag { box-shadow: none; }
    }
</style>
</head>
<body>

<p class="print-note">Cartão de Mesa Único (80mm x 95mm). Borda Dourada Espessa (+0,5cm). Imprime ou corta pelo contorno.</p>

<div class="single-wrapper">
    <div class="tag">
        <div class="tag-header">
            <p class="tag-name">Casa Primavera<small>Taberna Soares</small></p>
        </div>
        <div class="tag-body">
            <div class="qr-placeholder">
                <img src="images/qr-code.svg" alt="QR Code www.tabernasoares.com" class="qr-code-img">
            </div>
            <p class="tag-caption">Vê a nossa ementa</p>
        </div>
    </div>
</div>

</body>
</html>
